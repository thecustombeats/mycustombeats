; Staff production endpoints (art masters, print production masters, audio masters).
; Larger than the customer photo limit on purpose: production masters are never
; compressed to fit. Each endpoint still enforces its file-role limit
; (uploads.role_limits) exactly. PHP-FPM / LiteSpeed read this file.
upload_max_filesize = 260M
post_max_size = 270M
max_input_time = 300
