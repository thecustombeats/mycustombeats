    <!-- Fallback head tags, for crawlers that read the raw HTML and never run
         the app. Everything carrying HOMEPAGE-SPECIFIC copy is marked
         data-static-seo and removed by src/main.tsx before React renders.

         WHY THEY MUST BE REMOVED: react-helmet-async cannot replace a tag it
         did not create. It only appends its own. So these stayed in the head
         on every route, ahead of the per-page tags, and a crawler reads the
         FIRST of a duplicated meta — which meant /products, /faq and every
         other page reported the homepage description and the homepage og:url
         while their own sat below, ignored. The <title> was the exception and
         looked fine, because a document has one title element and helmet
         rewrites it in place.

         Tags WITHOUT the marker are route-independent and stay: they are true
         of every page, so there is nothing for a route to override. -->
    <title>Personalised Songs on Vinyl, CD &amp; MP3 | My Custom Beats</title>
    <meta data-static-seo name="description" content="Turn a memory into a personalised song, from £10. Choose vinyl, CD or MP3. Made for cruises, weddings, anniversaries and celebrations." />

    <!-- Social -->
    <meta property="og:site_name" content="My Custom Beats" />
    <meta data-static-seo property="og:title" content="Personalised Songs on Vinyl, CD &amp; MP3 | My Custom Beats" />
    <meta data-static-seo property="og:description" content="Turn a memory into a personalised song, from £10. Choose vinyl, CD or MP3." />
    <meta data-static-seo property="og:image" content="https://www.mycustombeats.com/images/hero-1.jpg" />
    <meta data-static-seo property="og:url" content="https://www.mycustombeats.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Static Organization identity, for crawlers that do not execute
      JavaScript. This app is client-rendered, so without this block a non-JS
      fetch of the homepage carries no machine-readable identity at all.

      IT MUST STAY IDENTICAL TO organizationEntity() IN src/lib/seo.ts.
      Both emit @id https://www.mycustombeats.com/#organization, so a crawler
      merges them into one node - and if they disagree, that node ends up
      holding two descriptions, or claiming a profile the other omits. The
      previous version did exactly that: a different description, a founder's
      personal Instagram in sameAs, and areaServed "Worldwide", which the site
      nowhere states.
    -->
    <script type="application/ld+json">
    {
          "@context": "https://schema.org",
          "@type": "OnlineStore",
          "@id": "https://www.mycustombeats.com/#organization",
          "name": "My Custom Beats",
          "alternateName": "MCB",
          "url": "https://www.mycustombeats.com",
          "description": "My Custom Beats turns a memory into a personalised song, written and produced to order and delivered as vinyl, CD or MP3, alongside physical keepsakes made to hold it.",
          "logo": {
                "@type": "ImageObject",
                "@id": "https://www.mycustombeats.com/#logo",
                "url": "https://www.mycustombeats.com/images/brand/MCB-Logo-Final.png",
                "caption": "My Custom Beats"
          },
          "image": {
                "@id": "https://www.mycustombeats.com/#logo"
          },
          "email": "hello@mycustombeats.com",
          "telephone": "+447340742009",
          "sameAs": [
                "https://www.youtube.com/@MyCustomBeats"
          ],
          "founder": [
                {
                      "@type": "Person",
                      "name": "Rinaldi"
                },
                {
                      "@type": "Person",
                      "name": "Shobha (Bella) Menezes"
                }
          ],
          "contactPoint": {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "email": "hello@mycustombeats.com",
                "telephone": "+447340742009",
                "url": "https://www.mycustombeats.com/#contact"
          }
    }
    </script>
